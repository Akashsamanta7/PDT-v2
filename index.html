<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier Duel Tournament</title><link rel="stylesheet" href="style.css">

<!-- html2canvas for downloading scorecard -->
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

</head>
<body><div class="container">

    <h1>PDT Admin Panel</h1>

    <!-- Leaderboard -->
    <div class="leaderboard">
        <h2>Live Leaderboard</h2>

        <div class="leaderboard-card">
            <img src="assets/gxl-logo.jpg" alt="GXL">
            <div>
                <h3>GXL</h3>
                <p id="gxlPoints">0 Points</p>
            </div>
        </div>

        <div class="leaderboard-card">
            <img src="assets/8obl-logo.jpg" alt="80BL">
            <div>
                <h3>80BL</h3>
                <p id="blPoints">0 Points</p>
            </div>
        </div>
    </div>

    <!-- Match Form -->
    <div class="form-box">

        <label>Match Number</label>
        <input type="number" id="matchNo" placeholder="Enter Match Number">

        <label>Match Type</label>
        <select id="matchType">
            <option value="">Select Match Type</option>
            <option value="1v1">1v1</option>
            <option value="2v2">2v2</option>
            <option value="4v4">4v4</option>
        </select>

        <label>Winner</label>
        <select id="winner">
            <option value="">Select Winner</option>
            <option value="GXL">GXL</option>
            <option value="80BL">80BL</option>
        </select>

        <label>Loser Rounds (0-5)</label>
        <input type="number" id="loserRounds"
               min="0" max="5">

        <button onclick="generateResult()">
            Generate Result
        </button>

        <button class="reset-btn"
                onclick="resetLeaderboard()">
            Reset Leaderboard
        </button>

    </div>

</div>

<!-- Result Popup -->

<div class="popup" id="popup">

    <div class="scorecard" id="scorecard">

        <h2>PREMIER DUEL TOURNAMENT</h2>

        <p class="match-id">
            MATCH #<span id="cardMatchNo"></span>
        </p>

        <div class="battle">

            <img id="leftLogo"
                 src="assets/gxl-logo.jpg">

            <span>⚔️</span>

            <img id="rightLogo"
                 src="assets/8obl-logo.jpg">

        </div>

        <div class="winner-banner">
            🏆 WINNER
            <br>
            <span id="cardWinner"></span>
        </div>

        <div class="details">
            <p>Mode : <span id="cardMode"></span></p>
            <p>Score : <span id="cardScore"></span></p>
            <p>Margin : <span id="cardMargin"></span></p>
        </div>

        <div class="points-section">
            <h3>Updated Leaderboard</h3>

            <p>GXL : <span id="cardGXL"></span></p>
            <p>80BL : <span id="cardBL"></span></p>
        </div>

        <div class="footer">
            Generated By Premier Duel Tournament
            <br>
            <span id="cardDate"></span>
        </div>

    </div>

    <button onclick="closePopup()">
        Close
    </button>

</div>

<script src="script.js"></script></body>
</html>
